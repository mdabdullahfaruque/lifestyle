# Local development dependencies (Plan Phase 0).
# `docker compose up -d`, then:
#   dotnet run --project src/Lifestyle.Api -- migrate
#   dotnet run --project src/Lifestyle.Api -- seed
#   dotnet run --project src/Lifestyle.Api

name: lifestyle

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lifestyle
      POSTGRES_PASSWORD: lifestyle
      POSTGRES_DB: lifestyle
      # Deterministic collation, so index behaviour and sort order match production.
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=en-US --encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifestyle -d lifestyle"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage. Set Storage:Provider=s3 to use it instead of local disk.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: lifestyle
      MINIO_ROOT_PASSWORD: lifestyle-dev-secret
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Catches every outbound email in development. Nothing leaves the machine.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    environment:
      MP_MAX_MESSAGES: 500

volumes:
  postgres-data:
  redis-data:
  minio-data:
