# Vendor storefront subdomains — {slug}.mylifestylemart.com
#
# NOT YET INSTALLED. Written 2026-09-16 after confirming that no vendor subdomain resolves at all
# in production — not even the three demo shops (`demo-arunima.mylifestylemart.com` is NXDOMAIN).
# See docs/07 §10 for the full story and what still has to happen before this file does anything.
#
# The API already resolves an arbitrary {slug}.mylifestylemart.com generically — see
# TenantResolutionMiddleware.cs — so this site file is the only code-side piece missing. It is a
# copy of mylifestylemart.com.conf's storefront block, with the server_name generalised to any
# single-label subdomain and pointed at a wildcard certificate instead of a per-host one.
#
# A literal server_name (seller, admin, api, media, the apex) always wins over this regex match in
# nginx regardless of file load order, so installing this cannot hijack those five hosts. It only
# ever matches a host nginx would otherwise not know — which today means "any shop slug, or a typo".
# `[^.]+` deliberately matches one label only: a vendor's own custom domain is a different, unbuilt
# feature (docs/07 §6, "vendor custom domains" — not built), and must not fall through to this file.

server {
    listen 80;
    server_name ~^[^.]+\.mylifestylemart\.com$;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name ~^[^.]+\.mylifestylemart\.com$;

    # A wildcard cert, not a per-host one — certbot's webroot/HTTP-01 flow used for every other
    # site here CANNOT issue this. It needs a DNS-01 challenge, which needs API access to whatever
    # manages mylifestylemart.com's DNS (Cloudflare). See docs/07 §10 for the exact command once
    # that access exists; nothing here issues or renews it.
    ssl_certificate     /etc/letsencrypt/live/mylifestylemart.com-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mylifestylemart.com-wildcard/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    server_tokens off;

    client_max_body_size 12M;

    location = /v1/internal/health {
        limit_req zone=api_lifestyle_bd_prod burst=20 nodelay;
        proxy_pass http://127.0.0.1:5600;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    location /v1/internal/ { return 404; }

    # Same-origin, exactly like the apex: the refresh cookie is SameSite=Strict, so a storefront
    # calling the API cross-origin would lose its session. The API reads $host itself to work out
    # which vendor this is — nginx does not need to know or pass the slug separately.
    location ^~ /v1/ {
        limit_req zone=api_lifestyle_bd_prod burst=50 nodelay;
        proxy_pass http://127.0.0.1:5600;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_connect_timeout 30s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # The same static storefront bundle the apex serves. The Angular app resolves which shop it is
    # from the API response, not from its own bundle, so one build serves every subdomain.
    root /var/www/lifestyle-storefront;
    index index.csr.html;

    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.csr.html;
        add_header Cache-Control "no-store" always;
    }

    location ~ /\. { deny all; return 404; }
}
