# Lifestyle Super-admin console — admin.mylifestylemart.com
#
# A static Angular SPA, served from this host rather than Cloudflare Pages. Pages was the plan
# (docs/06 step D1) and is still where these belong; the direct-upload token available at the time
# was refused by both wrangler and the upload-token API, so the consoles were moved here to stop
# being blocked. docs/07 §8 carries the revert trigger.
#
# /v1/* is proxied same-origin for the same reason the apex does it: the refresh cookie is
# SameSite=Strict, and a console that calls the API cross-origin loses its session on refresh.
# The bundle still points at https://api.mylifestylemart.com — this proxy is what makes moving it
# to a relative base URL a one-line change rather than a new site file.

server {
    listen 80;
    server_name admin.mylifestylemart.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name admin.mylifestylemart.com;

    ssl_certificate     /etc/letsencrypt/live/admin.mylifestylemart.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.mylifestylemart.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # This console is for platform administrators only. Keeping it out of search results is not security — the
    # API decides that — but an indexed admin login is an invitation to credential stuffing.
    add_header X-Robots-Tag "noindex, nofollow" always;
    server_tokens off;

    client_max_body_size 12M;

    location = /v1/internal/health {
        limit_req zone=api_lifestyle_bd_prod burst=20 nodelay;
        proxy_pass http://127.0.0.1:5600;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    location /v1/internal/ { return 404; }

    location ^~ /v1/ {
        limit_req zone=api_lifestyle_bd_prod burst=50 nodelay;
        proxy_pass http://127.0.0.1:5600;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_connect_timeout 30s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    root /var/www/lifestyle-admin;
    index index.html;

    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Hashed bundles are content-addressed, so they can cache indefinitely.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        # Never cache the shell, or a deploy leaves browsers on the old bundle.
        add_header Cache-Control "no-store" always;
    }

    location ~ /\. { deny all; return 404; }
}
