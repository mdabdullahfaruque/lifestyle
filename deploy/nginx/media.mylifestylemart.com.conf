# Lifestyle media — media.mylifestylemart.com serves the uploads directory read-only.
#
# Replaces the `media.{$ROOT_DOMAIN}` site in deploy/Caddyfile. Same two locks as that file:
# the private/ prefix is refused here, and uploaded bytes are served with a sandboxing CSP so
# attacker-supplied content can never execute in the platform's origin.

server {
    listen 80;
    server_name media.mylifestylemart.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name media.mylifestylemart.com;

    ssl_certificate     /etc/letsencrypt/live/media.mylifestylemart.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/media.mylifestylemart.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    server_tokens off;

    root /var/data/lifestyle/bd-prod/uploads;

    # KYC documents. Served ONLY by the API's authorised /v1/media/private/{id} endpoint —
    # an identity card must never sit on a public, cacheable URL. This is the edge lock; the
    # key prefix in the storage layer is the second.
    location ^~ /private/ { return 404; }

    location / {
        # Derivative keys contain a random id and are never rewritten, so they cache hard.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # Uploads are attacker-supplied bytes: never let the browser sniff a type, and never let
        # anything served from this host execute in the platform's origin.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; sandbox" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri =404;
    }

    location ~ /\. { deny all; return 404; }
}
