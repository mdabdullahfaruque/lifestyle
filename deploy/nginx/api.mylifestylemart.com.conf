# Lifestyle API — api.mylifestylemart.com -> lifestyle-bd-prod-api on 127.0.0.1:5600
#
# Replaces the `api.{$ROOT_DOMAIN}` site in deploy/Caddyfile, which is not used on this host:
# host nginx owns 80/443 here (see deploy/docker-compose.host-nginx.yml).

server {
    listen 80;
    server_name api.mylifestylemart.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name api.mylifestylemart.com;

    ssl_certificate     /etc/letsencrypt/live/api.mylifestylemart.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.mylifestylemart.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    server_tokens off;

    # The app caps uploads at 10 MB; give the edge a little headroom.
    client_max_body_size 12M;

    # If this record is ever switched to Cloudflare-proxied (orange), add the current ranges from
    # https://www.cloudflare.com/ips/ as `set_real_ip_from` plus `real_ip_header CF-Connecting-IP`
    # — otherwise every request is attributed to Cloudflare and rate limiting keys on their IPs.

    # /v1/internal/* is for the edge and monitoring, never the public internet — this is the
    # block_internal snippet from deploy/Caddyfile. Health is the deliberate exception: uptime
    # monitors probe it and it reveals only "Healthy".
    location = /v1/internal/health {
        limit_req zone=api_lifestyle_bd_prod burst=20 nodelay;
        proxy_pass http://127.0.0.1:5600;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    location /v1/internal/ { return 404; }

    # The whole /v1/media group is uploads and private downloads (MediaModule.cs maps it with
    # RequireRateLimiting(Uploads)); POST /v1/media is the upload itself.
    location ^~ /v1/media {
        limit_req zone=upload_lifestyle_bd_prod burst=10 nodelay;
        proxy_pass http://127.0.0.1:5600;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        client_max_body_size 12M;
        proxy_request_buffering off;
    }

    location / {
        limit_req zone=api_lifestyle_bd_prod burst=50 nodelay;
        # Overwrite rather than append. The API clears KnownProxies (EndpointRegistration.cs), so
        # it trusts this header outright — one clean value is what Caddy's
        # `header_up X-Forwarded-For {client_ip}` produced, and a caller cannot smuggle its own.
        proxy_pass http://127.0.0.1:5600;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_connect_timeout 30s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    location ~ /\. { deny all; return 404; }
}
