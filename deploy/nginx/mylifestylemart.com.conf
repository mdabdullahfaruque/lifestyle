# Lifestyle marketplace apex — mylifestylemart.com / www
#
# PHASE 1 (superseded): this served a holding page until the storefront landed.
# It now serves the storefront as static files. PHASE 2 replaces that with a proxy to the SSR
# container on 127.0.0.1:4000 — see the marked block below.
#
# /v1/* is proxied here too, deliberately: the refresh cookie is SameSite=Strict, so a storefront
# served from this host must call the API same-origin or sessions break (docs/05 §2, note 3).

server {
    listen 80;
    server_name mylifestylemart.com www.mylifestylemart.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name mylifestylemart.com www.mylifestylemart.com;

    ssl_certificate     /etc/letsencrypt/live/mylifestylemart.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mylifestylemart.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    server_tokens off;

    client_max_body_size 12M;

    location = /v1/internal/health {
        limit_req zone=api_lifestyle_bd_prod burst=20 nodelay;
        proxy_pass http://127.0.0.1:5600;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    location /v1/internal/ { return 404; }

    location ^~ /v1/ {
        limit_req zone=api_lifestyle_bd_prod burst=50 nodelay;
        proxy_pass http://127.0.0.1:5600;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_connect_timeout 30s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # The storefront, served as static files.
    #
    # PHASE 2 (docs/05 §9, docs/07 §3): replace this whole block with
    #     proxy_pass http://127.0.0.1:4000;
    # once the SSR container is up. Until then these pages render in the browser, which means
    # search engines and WhatsApp link previews see an empty shell — acceptable for a demo, not
    # for launch, because link previews are the v1 order path.
    root /var/www/lifestyle-storefront;

    # Angular emits index.csr.html in client-render mode, not index.html.
    index index.csr.html;

    # Hashed bundles are content-addressed, so they can cache indefinitely.
    location ~* .(?:js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        # SPA fallback: deep links are routed by the client, so every unmatched path serves the
        # shell rather than a 404.
        try_files $uri $uri/ /index.csr.html;
        # The shell itself must never be cached, or a deploy leaves browsers on the old bundle.
        add_header Cache-Control "no-store" always;
    }

    location ~ /\. { deny all; return 404; }
}
