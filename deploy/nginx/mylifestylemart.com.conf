# Lifestyle marketplace apex — mylifestylemart.com / www
#
# PHASE 1: the public storefront is deferred (docs/05 §9), so this serves the holding page from
# the Caddyfile's `coming_soon` snippet. PHASE 2: replace the `location /` root/index below with
# a proxy_pass to the storefront SSR container on 127.0.0.1:4000.
#
# /v1/* is proxied here too, deliberately: the refresh cookie is SameSite=Strict, so a storefront
# served from this host must call the API same-origin or sessions break (docs/05 §2, note 3).

server {
    listen 80;
    server_name mylifestylemart.com www.mylifestylemart.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name mylifestylemart.com www.mylifestylemart.com;

    ssl_certificate     /etc/letsencrypt/live/mylifestylemart.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mylifestylemart.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    server_tokens off;

    client_max_body_size 12M;

    location = /v1/internal/health {
        limit_req zone=api_lifestyle_bd_prod burst=20 nodelay;
        proxy_pass http://127.0.0.1:5600;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    location /v1/internal/ { return 404; }

    location ^~ /v1/ {
        limit_req zone=api_lifestyle_bd_prod burst=50 nodelay;
        proxy_pass http://127.0.0.1:5600;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_connect_timeout 30s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    location / {
        root /var/www/lifestyle-coming-soon;
        index index.html;
        try_files $uri /index.html;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex" always;
    }

    location ~ /\. { deny all; return 404; }
}
