# Override for a host that already runs its own reverse proxy.
#
#   docker compose -f deploy/docker-compose.prod.yml -f deploy/docker-compose.host-nginx.yml \
#     --env-file deploy/.env up -d
#
# The shared Contabo box (94.136.186.220) already terminates TLS with **host nginx** on ports
# 80/443 for four other APIs (PropertyMart bd-prod/bd-staging/my-prod, SasthoSeba staging), each
# proxying to a container published on 127.0.0.1:5X00. The stock stack's Caddy container binds
# 80/443 itself, which on this host would fail to bind and, if it ever won the race, would take
# those production sites down.
#
# So this override:
#   - parks `caddy` behind a compose profile, so it never starts unless explicitly asked for;
#   - publishes the API on a host port for the existing proxy to reach;
#   - moves uploaded media to a host path the existing proxy can serve;
#   - names containers `lifestyle-<deployment>-*`, matching the box's convention.

services:
  caddy:
    # Never started by `up`. `--profile edge` is the only way to bring it in, which on this host
    # you must not do.
    profiles: ["edge"]

  api:
    container_name: lifestyle-${DEPLOYMENT:-my-prod}-api
    ports:
      # 127.0.0.1 once a proxy fronts the API. 0.0.0.0 publishes it to the internet in the clear.
      - "${API_BIND:-127.0.0.1}:${API_HOST_PORT:-5600}:8080"
    volumes:
      # Replaces the stock `api-storage` named volume at this mount point. Caddy used to serve
      # that volume; with Caddy parked, host nginx serves media instead — and nginx cannot read a
      # Docker named volume, because /var/lib/docker is not traversable by www-data. A bind mount
      # under /var/data/<app>/<env>/uploads is what the other stacks on this host already do.
      # The directory must be owned by uid 64198 (the image's `lifestyle` user) and world-readable.
      - ${MEDIA_HOST_PATH:?set MEDIA_HOST_PATH in deploy/.env}:/app/.storage

  postgres:
    container_name: lifestyle-${DEPLOYMENT:-my-prod}-db

  redis:
    container_name: lifestyle-${DEPLOYMENT:-my-prod}-redis
