<!-- Search-first chrome: the value-retail direction puts search in the header, not behind an icon. -->
<header class="top">
  <div class="shell top__inner">
    <a routerLink="/" class="brand display">Lifestyle</a>

    <form class="search" role="search" (submit)="$event.preventDefault()">
      <svg class="search__icon" viewBox="0 0 20 20" aria-hidden="true">
        <circle cx="9" cy="9" r="6" fill="none" stroke="currentColor" stroke-width="2" />
        <path d="M13.5 13.5 L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      </svg>
      <input type="search" placeholder="Search everything on Lifestyle" aria-label="Search everything on Lifestyle" />
    </form>

    <a class="top__account" routerLink="/" aria-label="Account">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="2" />
        <path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      </svg>
    </a>
  </div>
</header>

<main class="page">
  <router-outlet />
</main>

<footer class="foot">
  <div class="shell">
    <p class="foot__brand display">Lifestyle</p>
    <p class="muted foot__note">
      A marketplace for Bangladeshi shops. Ordering happens over WhatsApp with the seller —
      no checkout in this version.
    </p>
  </div>
</footer>

<!-- Mobile bottom nav, per the Main artboard. Hidden on desktop, where the header carries nav. -->
<nav class="bottom" aria-label="Primary">
  <a routerLink="/" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
    <span>Home</span>
  </a>
  <a routerLink="/" aria-disabled="true">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h16l-1 12H5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9 8V6a3 3 0 0 1 6 0v2" fill="none" stroke="currentColor" stroke-width="2"/></svg>
    <span>Shops</span>
  </a>
  <a routerLink="/" aria-disabled="true">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.5-7-9a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 4.5-7 9-7 9z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
    <span>Saved</span>
  </a>
  <a routerLink="/" aria-disabled="true">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M5 20c0-3.9 3.1-6 7-6s7 2.1 7 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <span>Account</span>
  </a>
</nav>
