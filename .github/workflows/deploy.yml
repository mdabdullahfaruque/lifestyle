name: Deploy

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      deployment:
        description: Which country stack to deploy
        required: true
        default: my-prod
        type: choice
        options: [my-prod, bd-prod, apac-staging]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Build once, deploy that exact image. Never rebuild per environment — the
  # artifact that was tested must be the artifact that ships.
  # ───────────────────────────────────────────────────────────────────────────
  images:
    name: Build images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: echo "tag=${GITHUB_REF_NAME#v}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/api.Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/lifestyle-api:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # PHASE 2 (docs/05 §9): restore the storefront SSR image build here —
      # deploy/storefront.Dockerfile is ready and tested, it is just not deployed yet.
      #
      #  - name: Storefront SSR image
      #    uses: docker/build-push-action@v6
      #    with:
      #      context: .
      #      file: deploy/storefront.Dockerfile
      #      push: true
      #      tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/lifestyle-storefront:${{ steps.meta.outputs.tag }}

  # ───────────────────────────────────────────────────────────────────────────
  # The seller and admin SPAs are NOT deployed here: Cloudflare Pages' own git
  # integration builds and publishes them on every push to master, which is the
  # workflow this account already uses. See docs/05 §4 — including the note on
  # keeping API changes additive so an auto-deployed SPA never outruns the API.
  # ───────────────────────────────────────────────────────────────────────────

  # ───────────────────────────────────────────────────────────────────────────
  # Backend rollout over SSH. Migrations run first, as a separate step.
  # ───────────────────────────────────────────────────────────────────────────
  server:
    name: Deploy backend
    runs-on: ubuntu-latest
    needs: images
    environment: ${{ inputs.deployment || 'my-prod' }}   # approval gate lives here

    steps:
      - name: Roll the stack
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            set -Eeuo pipefail
            cd /srv/lifestyle
            git fetch --tags --quiet
            git checkout --quiet "${{ github.ref_name }}"
            ./deploy/scripts/deploy.sh "${{ inputs.deployment || 'my-prod' }}" "${{ needs.images.outputs.tag }}"

      - name: Smoke test
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://api.${{ vars.ROOT_DOMAIN }}/v1/internal/health" || true)
            [ "$code" = "200" ] && echo "healthy" && exit 0
            sleep 6
          done
          echo "API did not report healthy after rollout" >&2
          exit 1
