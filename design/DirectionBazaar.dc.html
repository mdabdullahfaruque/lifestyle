<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; background: #F3F1EC; font-family: system-ui, 'Segoe UI', sans-serif; color: #47423C; }
    a { color: #C2410C; text-decoration: none; } a:hover { color: #9A3412; }
  </style>
</helmet>
<div style="width: 390px; min-height: 1000px; background: #F3F1EC; display: flex; flex-direction: column; gap: 10px; padding-bottom: 20px">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 14px 0 14px">
    <div style="font-size: 12px; font-weight: 700; letter-spacing: 1px; color: #9C958B; border: 1.5px dashed #C9C2B6; border-radius: 6px; padding: 4px 10px">LO-FI · DIRECTION A</div>
    <div style="font-size: 12px; font-weight: 700; color: #C2410C">Bazaar energy</div>
  </div>

  <!-- header + search -->
  <div style="display: flex; gap: 8px; padding: 6px 14px 0 14px">
    <div style="flex: 1; height: 40px; background: #E4E0D7; border: 1.5px dashed #C9C2B6; border-radius: 8px"></div>
    <div style="width: 40px; height: 40px; background: #C2410C; border-radius: 8px"></div>
  </div>

  <!-- flash sale strip -->
  <div style="margin: 4px 14px 0 14px; background: #C2410C; border-radius: 10px; padding: 12px 14px; display: flex; align-items: center; justify-content: space-between">
    <div style="color: #FFF6EE; font-weight: 800; font-size: 15px">FLASH SALE</div>
    <div style="display: flex; gap: 5px">
      <div style="background: rgba(255,255,255,0.9); color: #C2410C; font-weight: 800; font-size: 12px; border-radius: 5px; padding: 4px 7px">02</div>
      <div style="background: rgba(255,255,255,0.9); color: #C2410C; font-weight: 800; font-size: 12px; border-radius: 5px; padding: 4px 7px">14</div>
      <div style="background: rgba(255,255,255,0.9); color: #C2410C; font-weight: 800; font-size: 12px; border-radius: 5px; padding: 4px 7px">55</div>
    </div>
  </div>

  <!-- horizontal deals -->
  <div style="display: flex; gap: 8px; padding: 4px 14px 0 14px">
    <div style="flex: 1; display: flex; flex-direction: column; gap: 6px">
      <div style="height: 90px; background: #E4E0D7; border: 1.5px dashed #C9C2B6; border-radius: 8px; position: relative">
        <div style="position: absolute; top: 6px; left: 6px; background: #C2410C; color: #FFF; font-size: 10px; font-weight: 800; padding: 3px 6px; border-radius: 4px">-40%</div>
      </div>
      <div style="height: 10px; width: 80%; background: #D6D1C6; border-radius: 4px"></div>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 6px">
      <div style="height: 90px; background: #E4E0D7; border: 1.5px dashed #C9C2B6; border-radius: 8px; position: relative">
        <div style="position: absolute; top: 6px; left: 6px; background: #C2410C; color: #FFF; font-size: 10px; font-weight: 800; padding: 3px 6px; border-radius: 4px">-25%</div>
      </div>
      <div style="height: 10px; width: 70%; background: #D6D1C6; border-radius: 4px"></div>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 6px">
      <div style="height: 90px; background: #E4E0D7; border: 1.5px dashed #C9C2B6; border-radius: 8px; position: relative">
        <div style="position: absolute; top: 6px; left: 6px; background: #C2410C; color: #FFF; font-size: 10px; font-weight: 800; padding: 3px 6px; border-radius: 4px">-60%</div>
      </div>
      <div style="height: 10px; width: 85%; background: #D6D1C6; border-radius: 4px"></div>
    </div>
  </div>

  <!-- voucher row -->
  <div style="display: flex; gap: 8px; padding: 4px 14px 0 14px">
    <div style="flex: 1; height: 52px; border: 1.5px dashed #C2410C; border-radius: 8px; background: #FCEEE4; display: flex; align-items: center; justify-content: center; color: #C2410C; font-weight: 800; font-size: 12px">৳100 OFF</div>
    <div style="flex: 1; height: 52px; border: 1.5px dashed #C2410C; border-radius: 8px; background: #FCEEE4; display: flex; align-items: center; justify-content: center; color: #C2410C; font-weight: 800; font-size: 12px">FREE SHIP</div>
    <div style="flex: 1; height: 52px; border: 1.5px dashed #C2410C; border-radius: 8px; background: #FCEEE4; display: flex; align-items: center; justify-content: center; color: #C2410C; font-weight: 800; font-size: 12px">NEW USER</div>
  </div>

  <!-- dense 2-col grid -->
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; padding: 8px 14px 0 14px">
    <div style="background: #FFFFFF; border: 1.5px dashed #C9C2B6; border-radius: 8px; overflow: hidden">
      <div style="height: 150px; background: #E4E0D7; position: relative">
        <div style="position: absolute; top: 6px; right: 6px; background: #C2410C; color: #FFF; font-size: 10px; font-weight: 800; padding: 3px 6px; border-radius: 4px">HOT</div>
      </div>
      <div style="padding: 8px; display: flex; flex-direction: column; gap: 6px">
        <div style="height: 9px; width: 90%; background: #D6D1C6; border-radius: 4px"></div>
        <div style="height: 9px; width: 55%; background: #D6D1C6; border-radius: 4px"></div>
        <div style="height: 13px; width: 45%; background: #C2410C; border-radius: 4px"></div>
      </div>
    </div>
    <div style="background: #FFFFFF; border: 1.5px dashed #C9C2B6; border-radius: 8px; overflow: hidden">
      <div style="height: 150px; background: #E4E0D7"></div>
      <div style="padding: 8px; display: flex; flex-direction: column; gap: 6px">
        <div style="height: 9px; width: 85%; background: #D6D1C6; border-radius: 4px"></div>
        <div style="height: 9px; width: 60%; background: #D6D1C6; border-radius: 4px"></div>
        <div style="height: 13px; width: 40%; background: #C2410C; border-radius: 4px"></div>
      </div>
    </div>
    <div style="background: #FFFFFF; border: 1.5px dashed #C9C2B6; border-radius: 8px; overflow: hidden">
      <div style="height: 150px; background: #E4E0D7"></div>
      <div style="padding: 8px; display: flex; flex-direction: column; gap: 6px">
        <div style="height: 9px; width: 88%; background: #D6D1C6; border-radius: 4px"></div>
        <div style="height: 13px; width: 42%; background: #C2410C; border-radius: 4px"></div>
      </div>
    </div>
    <div style="background: #FFFFFF; border: 1.5px dashed #C9C2B6; border-radius: 8px; overflow: hidden">
      <div style="height: 150px; background: #E4E0D7; position: relative">
        <div style="position: absolute; top: 6px; right: 6px; background: #C2410C; color: #FFF; font-size: 10px; font-weight: 800; padding: 3px 6px; border-radius: 4px">-30%</div>
      </div>
      <div style="padding: 8px; display: flex; flex-direction: column; gap: 6px">
        <div style="height: 9px; width: 80%; background: #D6D1C6; border-radius: 4px"></div>
        <div style="height: 13px; width: 48%; background: #C2410C; border-radius: 4px"></div>
      </div>
    </div>
  </div>

  <div style="padding: 12px 18px 0 18px; font-size: 12px; line-height: 1.6; color: #7A756C"><b>Dense, promo-led, discount-forward.</b> Familiar to Shopee/Daraz shoppers — but vendor brands drown in the noise, and "curated" positioning is lost.</div>
</div>
</x-dc>
</body>
</html>
